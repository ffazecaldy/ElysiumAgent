# Elysium Agent — agent harness (chat + loop multi-agente)
llm:
  provider: opencode-go
  base_url: "https://opencode.ai/zen/go/v1"
  model: deepseek-v4-flash
  api_key_env: OPTIMIZE_ENGINE_API_KEY   # valorizzata con OPENCODE_GO_API_KEY
  max_retries: 3
  timeout_s: 300

harness:
  max_concurrent: 8        # agenti paralleli nel loop
  max_retries: 2           # retry per task sotto soglia
  quality_threshold: 7.0
  projects_dir: "projects" # workspace dei progetti (relativa alla root)
  git_enabled: true        # checkpoint/rollback/commit (v0.16)
  execution_enabled: true  # esecuzione verifica reale nel workspace (v0.16)
  execution_timeout_s: 120 # timeout rigoroso per il runner di verifica (v0.16)
  rollback_on_failure: true # rollback selettivo dei task falliti (v0.16)

server:
  host: "127.0.0.1"
  port: 8137

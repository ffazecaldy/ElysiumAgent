<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Elysium Agent">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#7c5cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <clipPath id="square-clip">
      <rect x="28" y="28" width="200" height="200" rx="40"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sfera di luce / nebulosa -->
  <circle cx="128" cy="128" r="118" fill="url(#halo)"/>

  <!-- rounded square di sfondo (dark) -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="46.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- tile gradiente blu-viola -->
  <rect x="28" y="28" width="200" height="200" rx="40" fill="url(#g)"/>
  <rect x="28" y="28" width="200" height="200" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- highlight superiore (effetto vetro) -->
  <g clip-path="url(#square-clip)">
    <rect x="28" y="28" width="200" height="88" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- fulmine stilizzato con glow -->
  <path d="M140 44 L88 142 H126 L112 212 L168 102 H130 Z" fill="#eef2fb" filter="url(#glow)"/>
</svg>

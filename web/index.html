<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elysium Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body x-data="app()" x-init="init()">
  <a href="#chat" class="skip-link">Salta al contenuto</a>

  <!-- header con glow -->
  <header class="topbar">
    <div class="brand">
      <span class="logo-pulse" aria-hidden="true">⚡</span>
      <h1>Elysium <span class="accent">Agent</span></h1>
      <span class="tag" :class="{on: connected}">{{ connected ? '● online' : '○ offline' }}</span>
    </div>
    <nav aria-label="principale">
      <button class="btn ghost" @click="view='chat'" :class="{active: view==='chat'}" aria-label="Chat">Chat</button>
      <button class="btn ghost" @click="openRuns" :class="{active: view==='runs'}" aria-label="Run">Run</button>
    </nav>
  </header>

  <main id="chat" class="layout">
    <!-- sidebar progetti -->
    <aside class="sidebar" aria-label="progetti">
      <div class="sidebar-head">
        <span class="muted">PROGETTI</span>
        <button class="btn mini" @click="newProject" aria-label="Nuovo progetto">+</button>
      </div>

      <div class="loading" x-show="loadingProjects" role="status" x-cloak>
        <div class="spinner" aria-hidden="true"></div><span>caricamento…</span>
      </div>

      <ul class="proj-list" x-show="!loadingProjects">
        <template x-for="p in projects" :key="p.id">
          <li class="proj-item" :class="{active: p.id===current?.id}"
              @click="switchProject(p.id)" role="button" tabindex="0"
              @keydown.enter="switchProject(p.id)">
            <span class="proj-dot" aria-hidden="true"></span>
            <span class="proj-name" x-text="p.name"></span>
            <span class="proj-files muted" x-text="p.files_count + ' file'"></span>
          </li>
        </template>
      </ul>

      <p class="empty" x-show="!loadingProjects && projects.length===0" x-cloak>
        Nessun progetto. <button class="btn mini" @click="newProject">Crealo</button>
      </p>
    </aside>

    <!-- area chat -->
    <section class="chat-area">
      <template x-if="current">
        <div>
          <div class="chat-head">
            <strong x-text="current.name"></strong>
            <span class="muted" x-text="current.files.length + ' file · ' + current.runs.length + ' run'"></span>
          </div>

          <div class="messages" id="messages" x-ref="messages" aria-live="polite">
            <template x-for="(m, i) in messages" :key="i">
              <div class="msg" :class="m.role" x-cloak>
                <div class="bubble">
                  <template x-if="m.role==='user'"><span class="who">tu</span></template>
                  <template x-else><span class="who">elysium</span></template>
                  <div class="md" x-html="renderMd(m.content)"></div>
                </div>
                <template x-if="m.meta && m.meta.run_report">
                  <div class="report-card">
                    <span class="rep-status" :class="m.meta.run_report.final_status"
                          x-text="m.meta.run_report.final_status"></span>
                    <span>first-pass <strong x-text="pct(m.meta.run_report.first_pass_rate)"></strong></span>
                    <span>qualità <strong x-text="m.meta.run_report.avg_quality + '/10'"></strong></span>
                    <span>task <strong x-text="m.meta.run_report.n_passed + '/' + m.meta.run_report.n_tasks"></strong></span>
                    <span>token <strong x-text="smart(m.meta.run_report.tokens_estimate)"></strong></span>
                  </div>
                </template>
              </div>
            </template>

            <!-- streaming / stato loop -->
            <div class="msg assistant" x-show="busy" x-cloak>
              <div class="bubble">
                <span class="who">elysium</span>
                <span class="cursor" x-show="loopActive" x-text="'loop Elysium attivo (tier ' + loopTier + ')…'"></span>
                <span class="cursor" x-show="!loopActive" >▍</span>
              </div>
            </div>
          </div>

          <!-- input -->
          <form class="composer" @submit.prevent="send">
            <textarea x-model="draft" rows="1" :disabled="busy"
              placeholder="Obiettivo o goal per il progetto… (tier 2+ attiva il loop Elysium)"
              @keydown.enter.prevent="send" aria-label="messaggio"></textarea>
            <button class="btn primary" type="submit" :disabled="busy || !draft.trim()" aria-label="Invia">
              <span x-show="!busy">▶</span><span x-show="busy" class="spinner sm"></span>
            </button>
          </form>

          <div class="error" x-show="error" x-text="error" role="alert" x-cloak></div>
        </div>
      </template>

      <template x-if="!current">
        <div class="empty hero">
          <h2>Benvenuto in Elysium Agent</h2>
          <p>Un ambiente di lavoro con la tua AI: crea un progetto, chatta, e per goal complessi
             attivo il loop multi-agente (decompose → scatter → quality gate → retry).</p>
          <button class="btn primary" @click="newProject">+ Crea il primo progetto</button>
        </div>
      </template>
    </section>
  </main>

  <footer><p>Elysium Agent — harness multi-agente · Elysium Swarmloop v0.15.0</p></footer>
</body>
</html>
